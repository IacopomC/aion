map_window:
  type: spatial
  max_radius_m: 5.0
active_window:
  volumetric_map:
    voxels_per_side: 16
    voxel_size: 0.4
    truncation_distance: 0.6
  tsdf:
    semantic_integrator:
      type: MLESemanticIntegrator
frontend:
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.2
  objects:
    min_cluster_size: 40
    cluster_tolerance: 0.25
  surface_places:
    type: place_2d
    prefix: P
    pure_final_place_size: 0.5
    place_memory_radius_m: 5
    active_place_radius_m: 5.0
    mesh_active_window_m: 20.0
    cluster_tolerance: 0.6
    min_cluster_size: 3
    max_cluster_size: 100000
    min_final_place_size: 3
    min_final_place_points: 10
    place_max_neighbor_z_diff: 0.5
    place_overlap_threshold: 0.0
    connection_ellipse_scale_factor: 0.8
  freespace_places:
    type: gvd
    filter_places: true
    min_places_component_size: 3
    filter_ground: false
    gvd:
      max_distance_m: 4.5
      min_distance_m: 0.2   # gvd seed (2026-06-14)
      min_diff_m: 0.1
      voronoi_config:
        mode: L1_THEN_ANGLE
        min_distance_m: 0.3
        parent_l1_separation: 20   # tuned (2026-06-14)
        parent_cos_angle_separation: 0.2   # tuned (2026-06-14)
    graph:
      type: CompressionGraphExtractor
      compression_distance_m: 1.3   # skeleton L3 density (2026-06-14)
      min_node_distance_m: 0.4   # tuned (2026-06-14)
      min_edge_distance_m: 0.15
      node_merge_distance_m: 0.3
      merge_policy: distance
    tsdf_interpolator:
      type: ''
  use_frontiers: false
  frontier_places:
    type: voxel_clustering
    cluster_tolerance: 0.3
    min_cluster_size: 10
    max_cluster_size: 100000
    max_place_radius: 5
    dense_frontiers: false
    frontier_splitting_threshold: 0.2
    point_threshold: 10
    recent_block_distance: 25
    minimum_relative_z: -1.0
    maximum_relative_z: 1
backend:
  add_places_to_deformation_graph: false   # tuned (2026-06-14)
  optimize_on_lc: true
  enable_node_merging: true
  update_functors:
    agents:
      type: UpdateAgentsFunctor
    objects:
      type: UpdateObjectsFunctor
    surface_places:
      type: Update2dPlacesFunctor
    places:
      type: UpdatePlacesFunctor
    frontiers:
      type: UpdateFrontiersFunctor
    rooms:
      type: UpdateRoomsFunctor
      room_finder:
        min_dilation_m: 0.5
        max_dilation_m: 1.2
        min_component_size: 10
        min_room_size: 10
        dilation_threshold_mode: PLATEAU
        min_lifetime_length_m: 0.1
        plateau_ratio: 0.15
        clustering_mode: NEIGHBORS
        dilation_diff_threshold_m: -1.0
    buildings:
      type: UpdateBuildingsFunctor
    zmq_labels:
      type: ZmqRoomLabelUpdater
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    enable_sparsify: true
    trans_node_dist: 1.0
    rot_node_dist: 1.2
    rpgo:
      odom_trans_threshold: 0.05
      odom_rot_threshold: 0.01
      pcm_trans_threshold: -1
      pcm_rot_threshold: -1
      lm_diagonal_damping: true
      gnc_alpha: 0.9
      gnc_max_iterations: 100
      gnc_mu_step: 1.6
      gnc_cost_tolerance: 1.0e-05
      gnc_weight_tolerance: 0.0001
      gnc_fix_prev_inliers: true
      verbosity: UPDATE
      solver: LM
    add_initial_prior: true
    covariance:
      odom: 0.01
      loop_close: 0.05
      sg_loop_close: 0.1
      prior: 0.01
      mesh_mesh: 0.01
      pose_mesh: 0.01
      place_mesh: 0.01
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
